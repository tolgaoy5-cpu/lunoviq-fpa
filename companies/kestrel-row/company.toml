# Kestrel Row Lettings Ltd: a fictional UK letting agent (all figures illustrative).
# Budget drivers for FY2026/27 (April 2026 - March 2027). Amounts in GBP, ex VAT.

[company]
name = "Kestrel Row Lettings Ltd"
model = "lettings"                     # driver-based budget template (fpa/drivers.py)
description = "Letting and property-management agent, about 420 managed properties"
currency = "GBP"
fy_start_month = 4                     # April
budget_year = 2026                     # FY2026/27 starts April 2026
first_actual_month = "2025-04"         # prior year FY2025/26 onwards
last_closed_month = "2026-09"          # H1 of FY2026/27 is closed

# Month index 1..12 = April..March. Lets are strongest in summer, weakest in December.
[seasonality]
lets = [0.90, 1.00, 1.15, 1.25, 1.30, 1.20, 1.00, 0.85, 0.60, 0.85, 0.95, 0.95]
utilities = [0.85, 0.75, 0.70, 0.70, 0.70, 0.80, 1.00, 1.20, 1.35, 1.40, 1.30, 1.25]

[portfolio]
opening_pum = 420                      # properties under management at 1 April 2026
gained_per_month = 7                   # new managed landlords' properties (x lets seasonality)
lost_rate_annual = 0.14                # share of the portfolio lost per year
opening_avg_rent = 1450.0              # GBP per month
rent_growth_monthly = 0.0040           # ~4.9% a year
collection_rate = 0.98

[fees]
management_fee = 0.12                  # of rent collected (raised from 11.5% in April 2026)
let_only_lets_per_month = 14           # x lets seasonality
let_only_fee = 0.08                    # of first year's rent
relet_rate_annual = 0.30               # share of managed stock re-let each year (x lets seasonality)
setup_fee = 450.0                      # per new tenancy on managed stock
renewal_rate_annual = 0.35
renewal_fee = 120.0
certificates_per_property_year = 1.3   # gas safety, EICR, EPC arranged per property a year
certificate_margin = 25.0
maintenance_spend_per_property = 90.0  # contractor spend per managed property a month
maintenance_commission = 0.10

# Headcount by role at 1 April 2026: [count, annual salary]
[staff.roles]
director = [2, 70000]
branch_manager = [2, 45000]
property_manager = [6, 32000]
negotiator = [4, 27000]
accounts = [2, 30000]
admin_compliance = [2, 25000]

[staff]
# planned hires: role, first month (YYYY-MM)
hires = [["property_manager", "2026-10"]]
leavers = []
employer_ni_rate = 0.15
employer_ni_threshold = 5000.0         # per employee per year
pension_rate = 0.03
commission_rate = 0.10                 # of let-only and set-up fees
salary_review_month = 4                # April pay rise already in the salaries above

[costs]
office_rent_rates = 5500.0
utilities = 900.0                      # x utilities seasonality
portals = 3200.0
marketing_base = 800.0
marketing_rate = 0.04                  # of let-only and set-up fees
software_per_user = 85.0
software_base = 600.0
insurance = 1300.0
professional_fees = 2100.0
motor_per_property_manager = 350.0
bad_debt_rate = 0.005                  # of fee revenue
other_overheads = 1500.0
depreciation = 1200.0
corporation_tax_rate = 0.25

[reporting]
# a line is flagged when the variance passes BOTH thresholds (favourable or adverse)
month_abs = 1000.0
month_pct = 0.10
ytd_abs = 3000.0
ytd_pct = 0.05

[cash]
# Office bank account (client money is held separately in trust and excluded).
opening_balance = 185000.0            # at the end of the last closed month
minimum_balance = 50000.0             # board-approved buffer
vat_rate = 0.20
vat_quarter_end_months = [3, 6, 9, 12]
vat_payment_lag_days = 37             # one month and seven days after the quarter end
payroll_day = 28                      # net pay and commission
paye_day = 22                         # PAYE/NI and pension, following month
supplier_day = 15                     # suppliers paid on 30-day terms, following month
employee_deductions = 0.17            # income tax and employee NI, % of gross (paid to HMRC)
employee_pension = 0.05               # employee pension, % of gross (paid to the pension provider)
office_rent_share = 0.73              # share of office rent and rates that is rent (quarterly in advance, + VAT)
rent_quarter_days = ["03-25", "06-24", "09-29", "12-25"]
invoice_terms_days = 14               # let-only and set-up fees are invoiced to landlords
rent_collection_profile = [0.60, 0.20, 0.10, 0.10]   # share of rent collected in days 1-7, 8-14, 15-21, 22-end
corporation_tax_due = "2027-01-01"    # FY2025/26 liability: nine months and a day after the year end
corporation_tax_fy_prior = 0.0        # filled from the prior-year actuals if 0
dividends = [["2026-12-18", 120000.0]]   # planned interim dividend to the shareholders
